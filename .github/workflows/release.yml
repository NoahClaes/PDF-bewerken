# Bouwt het Windows-installatieprogramma en publiceert het als GitHub-release.
# Start vanzelf zodra het versienummer in package.json verandert (bv. 1.1.0 -> 1.2.0).
# Bestaat er al een release met dat nummer, dan gebeurt er niets. De app haalt nieuwe versies hier op.
name: Windows-versie publiceren

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versie bepalen
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "Versie $version bestaat al." } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Onderdelen installeren
        if: steps.ver.outputs.exists == 'false'
        run: npm ci

      - name: App verpakken
        if: steps.ver.outputs.exists == 'false'
        run: npx electron-builder --win dir --x64 --publish never

      - name: Pictogram en versie-informatie
        if: steps.ver.outputs.exists == 'false'
        run: node tools/set-icon.mjs "dist/win-unpacked/PDF Bewerken.exe" build/icon.png build/icon.ico

      - name: Installatieprogramma maken
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $makensis "-DVERSION=${{ steps.ver.outputs.version }}" build/installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist/*.exe

      - name: Release publiceren
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PDF Bewerken ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/PDF Bewerken Setup *.exe
          fail_on_unmatched_files: true
          make_latest: true
