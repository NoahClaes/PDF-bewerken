# Bouwt een test-APK van de Android-app en test hem in een Android-emulator.
# Start met de hand (Actions -> Android testen -> Run workflow) of bij wijzigingen aan de Android-bestanden.
name: Android testen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'tools/make-android.py', 'tools/build-android.sh', 'tools/test-android.js']

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK bouwen (test)
        run: bash tools/build-android.sh debug
      - name: Testhulpmiddelen
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npm install --no-save --no-audit --no-fund playwright@1.63.0
      - name: KVM aanzetten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testen in de emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node tools/test-android.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test
          path: dist-android/
